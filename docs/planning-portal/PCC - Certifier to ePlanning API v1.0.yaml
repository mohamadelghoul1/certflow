    assessment:
      required:
      - bcaPerformanceReq
      - certificatePayments
      - consistentDevConsent
      - opDevConsentIssued
      - relevantConditionsComplied
      - scRequiredConditionsMet
      type: object
      properties:
        opDevConsentIssued:
          type: boolean
          description: This indicates if the operative development consent has been issued in relation to the proposed development.Has an operative development consent been issued in relation
            to the proposed development,required only for Construction certificate
        lapseDate:
          type: string
          description: This indicates the lapse date of the consent. Optional field for both Subdivision
            certificate and Construction certificate.Not applicable at Occupation
            certificate.
          format: date
        relevantConditionsComplied:
          type: string
          description: This indicates if all of the relevant conditions of consent have been complied with. Required field for Construction certificate ,Occupation certificate
            and Subdivision certificate . One of the below mentioned values must be
            selected for relevantConditionsComplied 1. Yes 2. No 3. Not applicable
          example: Refer to description for values
        bcaPerformanceReq:
          type: boolean
          description: This indicates if the proposed development meets the performance requirements of the BCA. Required field only Construction certificate not available
            for Subdivision certificate and Occupation certificate.
        sustainableBuildingsRequirementsMet:
          type: string
          description: This is to track if the requirements for the Sustainable Buildings SEPP were met. Values for this attribute are "Yes","No","NA". This is applicable and required for construction certificate and for the cases that are created after 1stOctober2023.
        isApplicantDBPSelectionCorrect:
          type: boolean
          description: This attribute is an obsolete attribute. Value for this is not required to be supplied anymore and when supplied the value will be ignored, as this attribute is functionally irrelavant. (Old description N/A - This indicates if the DBPexempt selection done by the applicant is correct. It is an Mandatory field for Construction certificate when classofdevelopemt is Class2. )
        certificatePayments:
          type: array
          description: This indicates if the relevant payments have been paid. Required field for Construction certificate, Occupation certificate and Subdivision certificate.
          items:
            $ref: '#/components/schemas/certificatePayments'
        scRequiredConditionsMet:
          type: boolean
          description: This indicates whether all conditions required for the issuing of this subdivision certificate been satisfied or not. Required field only for Subdivision certificate type and used to hold.
        consistentDevConsent:
          type: boolean
          description: This indicates if the construction subject of this occupation certificate consistent with the development consent in force. Only applicable for Occupation certificate. Not available for Subdivision certificate and Construction certificate.
        isFireSafetyReferralRequired:
          type: boolean
          description: This indicates if the fire safety referral is required. It is an optional field applicable for Occupation certificate
            and construction certficate. It infers whether the application require
            referral for fire rescue NSW. For OC, it will be asking question as “Does
            this application require a Fire Safety referral to Fire Rescue NSW?” while
            for CC it will be asking question as “Does this application require a
            referral to Fire and Rescue NSW?”
        assessmentNotes:
          maxLength: 512
          type: string
          description: This indicates the assessment notes. Optional field for Occupation certificate.
        updatedByEmail:
          maxLength: 250
          type: string
          description: User must be registered in the planning portal
          example: john.smith@gmail.com
    certificatePayments:
      type: string
      description: Capture type of payment made prior to release of certificate, whenever
        we select the 'No payment applicable' option then all option will reset to
        No. Applicable for all Subdivision certificate,Occupation certificate, Construction
        certificate . One of the below mentioned values must be selected for certificatePayments.
        1. Local contributions plan payment 2. Local voluntary planning agreement
        3. Special infrastructure contribution 4. State voluntary planning agreement
        5. Bond(s) 6. Long service levy 7. Other payment 8. No payments applicable
      example: Refer to description for values
