openapi: 3.0.1
info:
  title: PCC - Certifier to ePlanning API
  description: "# Authentication    \n\nPlease use the subscription key provided by\
    \ the Department to access the APIs.\n"
  contact: {}
  version: v1
servers:
- url: https://api.apps1.nsw.gov.au/planning/PCCMgmt/Certifiers/v1
paths:
  /AcceptReturn/{CaseID}:
    put:
      summary: AcceptReturn
      description: This operation transfers the certifier's decision regarding acceptance, declination, or return of the Post Consent Certificate case from the certifier's IT system to the Online PCC Service.
      operationId: put-acceptreturn-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/acceptReturn'
        required: true
      responses:
        200:
          description: Case Accepted Successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /Assessment/{CaseID}:
    put:
      summary: Assessment
      description: This operation transfers the certifier's assessment information
        for Occupation, Construction and Sub-divisio certificate on the Post-consent
        Certificate case from the certifier's IT system to the Online Post-consent
        Certificate Service.
      operationId: put-assessment-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assessment'
        required: true
      responses:
        200:
          description: Assessment Created sucessfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /ReportFireSafetyIssue/{CaseID}:
    put:
      summary: ReportFireSafetyIssue
      description: This operation transfers the notification details of the significant
        fire safety issues reported to the councils on the Post-consent Certificate
        case from the certifier's IT system to the Online Post-consent Certificate
        Service. This section extends to a council that is a certifier or principal
        certifier.
      operationId: put-ReportFireSafetyIssue-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireSafetyIssue'
        required: true
      responses:
        200:
          description: Performed Report significant fire safety issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /InitiateInspection/{CaseID}:
    post:
      summary: InitiateInspection
      description: This operation transfers the certifier's initial inspection information
        on the Post-consent Certificate case from the certifier's IT system to the
        Online Post-consent Certificate Service. This will not be applicable for subdivision
        work certificate
      operationId: post-initiateinspection-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: organisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/initiateInspection'
        required: true
      responses:
        200:
          description: CaseID--XXX created Sucessfully.
          content: {}
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /PerformInspection/{CaseID}:
    put:
      summary: PerformInspection
      description: This operation transfers the certifier's inspection information
        at the assessment stage from the certifier's IT system to the Online Post-consent
        Certificate Service.
      operationId: put-performinspection-Caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/performInspection'
        required: true
      responses:
        200:
          description: Case Performed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /MissedInspection/{CaseID}:
    put:
      summary: MissedInspection
      description: 'This operation transfers the certifier''s Missed inspection information
        on the Post-consent Certificate case from the certifier''s IT system.By performing this operation, the certifier consents to all declarations associated with recording the missed inspection details. Please refer to the ReferenceData API for the latest declaration information. This
        operation represents the missed action from UI and is not applicable for SWC. '
      operationId: put-Missedinspection-Caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissedInspection'
        required: true
      responses:
        200:
          description: Inspection Completed successfully
          content: {}
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /CompleteInspection/{CaseID}:
    put:
      summary: CompleteInspection
      description: This operation transfers the certifier's inspection completion
        information on the Post-consent Certificate case from the certifier's IT system
        to the Online Post-consent Certificate Service.
      operationId: put-completeinspection-Caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/completeInspection'
        required: true
      responses:
        200:
          description: Case Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /Determine/{CaseID}:
    put:
      summary: Determine
      description: This operation transfers the certifier's Determination decision
        for Occupation, Construction, PC Appointment, Subdivision works & Sub-division certificate
        on the Post-consent Certificate case from the certifier's IT system to the
        Online Post-consent Certificate Service.Certifiers will be unable to approve the certificates if the linked parent cases ( DA/StateDA/CDC) are still in progress and have not yet been determined. They will also be unable to approve certificates if there are outstanding Housing and Productivity payments. The only exception is for Principal Certifying Authority (PCA).
      operationId: put-determination-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Determination'
        required: true
      responses:
        200:
          description: Case Determined Sucessfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetermineResponse'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /NotifyCriticalStageInspection/{CaseID}:
    put:
      summary: NotifyCriticalStageInspection
      description: This operation is to notify the applicant of the critical stage
        inspections via the Portal so that the applicant can be informed.
      operationId: put-NotifyCriticalStageInspection-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyCriticalStageInspection'
        required: true
      responses:
        200:
          description: NotifyCriticalStageInspection was Successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /IssueBASIXCompletionReceipt/{CaseID}:
    put:
      summary: IssueBASIXCompletionReceipt
      description: This operation facilitates the certifier in issuing a BASIX completion receipt before the issuance of the Occupation Certificate (OC). This is specifically designed for the process of obtaining an Occupation Certificate and is intended to be carried out before the assessment operation.
      operationId: put-IssueBASIXCompletionReceipt-caseid
      parameters:
      - name: CaseID
        in: path
        description: A fully qualified application number or case id
        required: true
        schema:
          type: string
      - name: OrganisationID
        in: header
        description: The council LGA name or Private Certifier Organisation name to
          indicate where the request is originated from.
        required: true
        schema:
          type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBASIXCompletionReceipt'
        required: true
      responses:
        200:
          description: BASIX Completion Receipt Issued Sucessfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBASIXCompletionReceiptResponse'
        400:
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        404:
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Person:
      required:
      - familyName
      - firstName
      type: object
      properties:
        firstName:
          maxLength: 20
          type: string
        otherName:
          maxLength: 20
          type: string
        familyName:
          maxLength: 20
          type: string
        contactNumber:
          maxLength: 10
          minLength: 8
          pattern: ^[0-9]+$
          type: string
        email:
          maxLength: 250
          type: string
          format: email
    Error:
      required:
      - errorCode
      - statusCode
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: Internal Server error 19876
        activityId:
          type: string
          example: 00000011-0ab-xy00-0000-500000000000
        errorCode:
          type: string
          example: DPE_TMS01
        errorDetails:
          type: string
          example: Inner Exceptions, Stack Trace, etc
    Error400:
      required:
      - errorCode
      - statusCode
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        activityId:
          type: string
          example: 00000011-0ab-xy00-0000-500000000000
        errorCode:
          type: string
          example: DPE_TMS01
        errorDetails:
          type: string
          example: Inner Exceptions, Stack Trace, etc
    PersonBody:
      required:
      - emailAddress
      - firstName
      - surname
      type: object
      properties:
        firstName:
          maxLength: 20
          type: string
          example: John
        surname:
          maxLength: 20
          type: string
          example: Smith
        emailAddress:
          maxLength: 250
          type: string
          description: User must be registered in the planning portal
          example: john.smith@gmail.com
        contactNumber:
          maxLength: 10
          minLength: 8
          pattern: ^[0-9]+$
          type: string
    DownloadableDocument:
      required:
      - documentName
      - documentType
      - documentURL
      - uploadedDateTime
      type: object
      properties:
        documentName:
          maxLength: 150
          type: string
          description: document name has to be appended with file extension
          example: test.docx
        documentType:
          maxLength: 100
          type: string
        uploadedDateTime:
          type: string
          format: date-time
        documentURL:
          maxLength: 500
          type: string
          description: URL of the document to be downloaded
          format: uri
    UpdatedBy:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/PersonBody'
    completeInspection:
      required:
      - childCaseID
      - declarations
      - documents
      - inspectionResultDeclaration
      - isfurtherInspectionrequired
      - issueInspectionResultSheet
      type: object
      properties:
        childCaseID:
          type: string
          description: Used to hold the child case ID (Inspection case) to perform
            Complete Inspection action.
        issueInspectionResultSheet:
          type: boolean
          description: This is to indicate if the inspection sheet can be issued.
        isfurtherInspectionrequired:
          type: boolean
          description: This is to indicate if any further inspection is required.
        declarations:
          type: string
          description: required for Principal Certifier appointment,Occupation certificate,Subdivision
            certificate, Declaration for inspection result. Not applicable for Construction
            certificate. One of the below mentioned values must be selected for declarations
            1. I confirm that I have inspected the site subject of this application
          example: Refer to description for values
        inspectionResultDeclaration:
          type: string
          description: Declaration for inspection result. Required field for Construction
            Certificate type. One of the below mentioned values must be selected for
            inspectionResultDeclaration 1. I confirm that I have inspected the site
            subject of this application and existing works on the site are appropriately
            reflected in the construction certificate plans. 2. I confirm I have inspected
            the site subject of this application and there are site features which
            requires the construction certificate plans to be amended.
          example: Refer to description for values
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        updatedByEmail:
          maxLength: 250
          type: string
          description: User must be registered in the planning portal
          example: john.smith@gmail.com
    initiateInspection:
      required:
      - registrationNumber
      - inspectionType
      type: object
      properties:
        dateOfInspection:
          type: string
          description: This indicates the date on which inspection is scheduled.This field is available  only for Principal Certifier appointment and Occupation certificate .
          format: date
        description:
          maxLength: 512
          type: string
          description: This indicates the description of inspection, required for for Principal Certifier
            appointment and Occupation certificate Optional for Subdivision certificate
            and Construction Certificate. This will not be applicable for subdivision
            work certificate
        registrationNumber:
          maxLength: 100
          type: string
          description: This indicates the Registration number associated. This is a mandatory
            field and required only for Principal Certifier appointment and Occupation
            certificate, Subdivision certificate and Construction Certificate and
            not for SWC.
        inspectionType:
          type: array
          description: This indicates the type of inspection. Required for all types of certificates.
          items:
            $ref: '#/components/schemas/inspectionType'
        updatedByEmail:
          maxLength: 250
          type: string
          description: User must be registered in the planning portal
          example: john.smith@gmail.com
    PCCdeclarations:
      type: string
      description: PCC declarations are replaced with the confirmation text that reads
        ' By submitting this page and uploading the relevant documentation, I confirm
        that all documents have been signed by an appropriately qualified person and
        that all relevant legislative and regulatory requirements have been considered
        and adhered to as attested to by the signatory on the certificate.'This attribute
        will soon become obsolete. Required only when we select application status
        as approved but for Subdivision certificate if refused also mandatory.This
        field required for Subdivision certificate, Construction certificate and Occupation
        certificate s. (For Principal Certifier appointment Occupation certificate-
        Declarations four to ten are applicable for Principal Certifier appointment-Occupation
        certificate. Declaration four and six are required for Principal Certifier
        appointment-Occupation certificate). (For Principal Certifier appointment-Subdivision
        certificate Required, select all item as part of declaration if applicationStatus
        is selected as 'Yes, proceed to subdivision certificate' and select '11th'
        and '6th' if applicationStatus is selected as 'No, further works are required'.).This
        is an obsolete attribute.
    Determination:
      required:
      - accreditationNumber
      - registeredCertifierState
      - applicationDecision
      - documents
      type: object
      properties:
        isFurtherInspectionRequired:
          type: boolean
          description: Check for "Is further inspection required" and this field is
            required and applicable only for Principal Certifier appointment.
        ownersConsentProvided:
          type: string
          description:  This is to track whether written evidence of the owner's consent has been provided. Applicable only for Subdivision Certificates (SC) when 'developmentSiteOwner' is not 'I am the sole owner of the development site'.
           Example values are as below. 1. Yes 2. No 
           Please refer to the reference data API for the latest values.
        registerCertificate:
          type: string
          description: This is applicable for private certifiers only and not applicable
            for councils. When the value 'Yes' is given, a related inprogress Certificate
            Registration case will be created. When 'No' value is given, Certificate
            Registration case will not be created. This is not applicable for PCA.
            Defaulted to 'No'. 1. No 2. Yes
        applicationDecision:
          type: string
          description: This indicates whether the certificate is approved or refused. Required
            field for Subdivision certificate,Occupation certificate and Construction
            . 1st and 2nd are applicable for Construction certificate, Subdivision
            certificate ,Occupation certificate while 3rd to 5th are applicable for
            Principal Certifier appointment-Occupation certificate, Principal Certifier
            appointment-Subdivision certificate. One of the below mentioned values
            must be selected. 1. Approved 2. Refused 3. Yes, proceed
            to subdivision certificate 4. Yes, proceed to occupation certificate 5.
            No, further works are required
          example: Refer to description for values
        housingAndProductivityContributions:
          type: array
          description: This indicates the stages for the certificate that is being sought for staged developments. This is applicable when Housing and Productivity contributions have been identified for the certificates. Stages can be supplied whenever the certifier is required to amend stages supplied by the applicant. If the information is not available during submission, the certifier must input this information. This is not applicable for PCA. Below values can be used to capture stages. 
                 1.Stage 1,
                 2.Stage 2,
                 3.Stage 3, 
                 4.Stage 4, 
                 5.Stage 5
          items: 
            $ref: '#/components/schemas/Stage'  
        subType:
          type: string
          description: Required when we select the application status as approved
            only and this field used to select the type of certificate. the first
            two fields in the options are for Occupation certificate and next two
            are for the Construction certificate type and Subdivision work certififcate
            type. This option is not available for Subdivision certificate type. One
            of the below mentioned values must be selected for subType. 1. Occupation
            Certificate for part of the development 2. Occupation Certificate for
            the full development 3. Partial construction certificate 4. Full construction
            certificate
          example: Refer to description for values
        comments:
          type: string
          description: This indicates the determination related comments. Is an optional for Subdivision certificate, Occupation certificate.
            Is applicable for Occupation certificate when applicationDecision is 'Refused'
            and not available for PCA certificate and Construction certificate.
        determinationDate:
          type: string
          description: This indicates the date of determination, this field is required for Construction certificate, Occupation certificate and Principal Certifier appointment  and
            optional field for Subdivision certificate.
          format: date
        numOfBedrooms:
          type: array
          description: Applicable when determinationOutcome is 'Approved' . This is applicable for Occupation certificate.
          items:
            $ref: '#/components/schemas/NumberofBedrooms'
        categoryOfDevelopment:
          type: array
          description: Applicable when determinationOutcome is 'Approved'. This is applicable for Occupation certificate.
          items:
            $ref: '#/components/schemas/AddcategoryOfDevelopment'
        roomType:
          type: array
          description: This is to track the room types as part of development statistics. This is applicable for PCC-OC when determinationOutcome is 'Approved' and for development types - Hostel, Co-living House, Boarding house, Medium Density Housing, Attached dwelling, Dual occupancy, Manor house, Multi-dwelling housing,Multi-dwelling housing (terraces),Semi-detached dwelling. 
          items:
            $ref: '#/components/schemas/RoomTypes'
        declarations:
          type: array
          description: PCC declarations are replaced with the confirmation text that
            reads ' By submitting this page and uploading the relevant documentation,
            I confirm that all documents have been signed by an appropriately qualified
            person and that all relevant legislative and regulatory requirements have
            been considered and adhered to as attested to by the signatory on the
            certificate.This is an obsolete attribute.
          items:
            $ref: '#/components/schemas/PCCdeclarations'
        certifiersFullName:
            type: string
            maxLength: 50
            description: Certifiers full name, Optional field for Subdivision certificate and required field for Construction certificate, Principal Certifier appointment and Occupation certificates. Validation will be ignored, as there is a validation done on the Certifiers accreditationNumber for CC & OC for private and principal certifier.
        certifierCategory:
            type: string
            description: This indicates the category of the certifiers. This is required for private certifiers and not councils. This is applicable for CC and OC certificates only. One of the below values are expected to be supplied.     
                 1. Individual registered certifier under the Building and Development Certificates 2018 
                 2. Registered body corporate under the Building and Development Certificates 2018
              Individual registered certifier value will be defaulted for private certifiers to support existing API users. 
        RBCnumber:
            type: string
            description: This indicates Registered body corporate number. This is required only when certifierCategory is selected as 'Registered body corporate under the Building and Development Certificates 2018'. Registration number can be checked in the link -  https://applications.fairtrading.nsw.gov.au/bdcregister/    
        accreditationNumber:
          type: string
          description: This field refers to the certifier's registration number. This is to track the BDC registration number that is applicable for NSW certifiers (OR) AMR registration number (e.g. AMR-123456) that's applicable for interstate certifiers. This field is mandatory for all certificate types. 
        registeredCertifierState:
          type: string
          description: This is to track the state of the registered certifier. This field is relevant to Constuction certificates and Occupation Certificates only. NSW state is enabled as the default selection for the Council and the private certifiers.   
            1. Yes, in NSW
            2. Yes, in another state
          example: Refer to description for values
        registrationStateorTerritoryName:
          type: string
          description: This is to track the Registration state or territory. This is required when registeredCertifierState is "Yes, in another state"
            1. Victoria
            2. South Australia
            3. Western Australia
            4. Tasmania
            5. Northern Territory
            6. Australian Capital Territory
          example: Refer to description for values
        interStateLicenseNumber:
          type: string
