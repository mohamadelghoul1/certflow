openapi: 3.0.1
info:
  title: PCC - ePlanning to Certifier API
  description: "# Authentication    \n\nPlease use the subscription key provided by\
    \ the Department to access the APIs.\n"
  contact: {}
  version: v1
servers:
  - url: /
paths:
  /CreatePCC/{CaseID}:
    post:
      summary: CreatePCC
      description: 
        This operation transfers the Post-consent Certificate application
        created by the applicant from the Online Post-consent Certificate
        Service to the certifier's IT system.
      operationId: post-createpcc-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PCCertificate'
        required: true
      responses:
        '201':
          description: Created
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Post Consent Certificate case already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: applicable field values not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /UpdatePCC/{CaseID}:
    put:
      summary: UpdatePCC
      description: 
        This operation transfers the Post-consent Certificate application's
        updated details from the Online Post-consent Certificate Service to the
        certifier's IT system.
      operationId: post-updatepcc-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePCCertificate'
        required: true
      responses:
        '201':
          description: Created
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Post Consent Certificate case already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: applicable field values not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /UpdateAdditionalInfo/{CaseID}:
    put:
      summary: UpdateAdditionalInfo
      description: >
        This operation transfers the additional information uploaded by the
        applicant from the Online Post-consent Certificate Service to the
        certifier's IT system.
      operationId: post-provideaddinfo-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvideAddInfo'
        required: true
      responses:
        '201':
          description: Request created
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /Withdraw/{CaseID}:
    put:
      summary: Withdraw
      description: 
        This operation transfers the applicant's decision to withdraw the
        Post-consent Certificate application from the Online Post-consent
        Certificate Service to the certifier's IT system.
      operationId: post-withdrawpcc-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/withdraw'
        required: true
      responses:
        '200':
          description: Case withdrawn
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /ReqAddInfo/{CaseID}:
    put:
      summary: ReqAddInfo
      description: 
        This operation requests further information from certifier to process
        the case
      operationId: put-ReqAddInfo-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReqAddInfo'
        required: true
      responses:
        '200':
          description: Case ID (AI) created
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /IntentToCommenceWork/{CaseID}:
    put:
      summary: IntentToCommenceWork
      description: 
        This operation transfers the 'Intentiontocommencework' related
        application details in the Post-consent Certificate application ( PCA
        )created by the applicant from the Online Post-consent Certificate
        Service to the certifier's IT system. This is applicable only for
        principal certifiying authority appointment (PCA).
      operationId: put-Intentiontocommencework-caseid-out
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Intenttocommencework'
        required: true
      responses:
        '201':
          description: Request created
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Case not found or locked by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /ReferralAssessment/{CaseID}:
    put:
      summary: ReferralAssessment
      description: 
        This operation sends the information of the assessment of Referrals to
        Certifier's IT system.
      operationId: put-referralassessment-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier or Agency Organisation
            name to indicate where the request is originated from.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralAssessment'
        required: true
      responses:
        '200':
          description: Case Submitted by Applicant
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
  /ReferralDecision/{CaseID}:
    put:
      summary: ReferralDecision
      description: 
        This operation sends referral case information of subdivision PCC case
        created by the applicant from the eplanning to the certifier's IT
        system.
      operationId: post-refdecision-caseid
      parameters:
        - name: CaseID
          in: path
          description: A fully qualified application number or case id
          required: true
          schema:
            type: string
        - name: OrganisationID
          in: header
          description: 
            The council LGA name or Private Certifier Organisation name to
            indicate where the response is routed to.
          required: true
          schema:
            type: string
        - name: IdempotencyId
          in: header
          description: 
            Unique Id for this request. Allows the API to respond in an
            idempotent way if it has already been called with these parameters
            and prevents duplicate processing. Typically a UUID such as
            "63a9ba30-7a4b-4fac-b343-d1f05cf089f1"
          required: true
          schema:
            type: string
      requestBody:
        description: Information request object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRef'
        required: true
      responses:
        '200':
          description: Created
          content: {}
        '400':
          description: Invalid request supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: false
      x-codegen-request-body-name: body
components:
  schemas:
    Location:
      title: Location
      required:
        - address
        - lga
      type: object
      properties:
        address:
          minLength: 1
          maxLength: 250
          type: string
          description: Site addresses
          example: 19-33 Elizabeth Street, Narrandera, 2700
        addressDetail:
          $ref: '#/components/schemas/AddressDetail'
        lotList:
          type: array
          items:
            $ref: '#/components/schemas/LotSectionPlan'
        lga:
          minLength: 1
          maxLength: 30
          type: string
          description: Local Government Area under which this case falls
          example: PENRITH
        isPrimary:
          type: boolean
          description: 
            This is to track if the address provided is the primary address when
            multiple lot addresses are provided.
    TagsList:
      type: string
      description:
       This defines Tags which are set on the respective document. like isPublish,isSensitive etc
    AddressDetail:
      required:
        - postCode
        - state
        - streetName
        - suburb
      type: object
      properties:
        complexUnitType:
          type: string
        complexLevelType:
          type: string
        complexLevelNumber:
          type: string
        complexUnitIdentifier:
          type: string
        streetNumber1:
          type: string
        streetNumber2:
          type: string
        streetName:
          type: string
          minLength: 1
        streetSuffix:
          type: string
        streetType:
          type: string
        suburb:
          type: string
          minLength: 1
        latitude:
          type: number
        longitude:
          type: number
        wkid:
          type: string
        cadastralID:
          type: string
        gurasID:
          type: string
        primarySecondary:
          type: string
        state:
          type: string
          minLength: 1
        postCode:
          type: number
    LotSectionPlan:
      required:
        - lotsectionplan
      type: object
      properties:
        lotsectionplan:
          type: string
          example: 1/-/SPXXXXX
          minLength: 1
    Person:
      title: Person
      required:
        - familyName
        - firstName
      type: object
      properties:
        firstName:
          maxLength: 20
          type: string
          minLength: 1
        otherName:
          maxLength: 20
          type: string
        familyName:
          maxLength: 20
          type: string
          minLength: 1
        contactNumber:
          maxLength: 10
          minLength: 8
          pattern: ^[0-9]+$
          type: string
        email:
          maxLength: 250
          type: string
    Error:
      title: Error
      required:
        - errorCode
        - statusCode
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          example: 404
        message:
          type: string
          example: Internal Server error 19876
        activityId:
          type: string
          example: 00000011-0ab-xy00-0000-500000000000
        errorCode:
          type: string
          example: DPE_TMS01
          minLength: 1
        errorDetails:
          type: string
          example: Inner Exceptions, Stack Trace, etc
    PersonBody:
      title: PersonBody
      required:
        - email
        - familyName
        - firstName
      type: object
      properties:
        firstName:
          maxLength: 20
          type: string
          example: John
          minLength: 1
        familyName:
          maxLength: 20
          type: string
          example: Smith
          minLength: 1
        email:
          maxLength: 250
          type: string
          description: User must be registered in the planning portal
          example: john.smith@gmail.com
          minLength: 1
        contactNumber:
          maxLength: 10
          minLength: 8
          pattern: ^[0-9]+$
          type: string
    PersonBodyOut:
      required:
        - familyName
        - firstName
        - email
      type: object
      properties:
        firstName:
          maxLength: 20
          type: string
          example: John
          minLength: 1
        familyName:
          maxLength: 20
          type: string
          example: Smith
          minLength: 1
        email:
          maxLength: 250
          type: string
          description: User must be registered in the planning portal
          example: john.smith@gmail.com
          minLength: 1
        contactNumber:
          maxLength: 10
          minLength: 8
          pattern: ^[0-9]+$
          type: string
    DownloadableDocument:
      title: DownloadableDocument
      required:
        - documentName
        - documentType
        - documentURL        
        - uploadedDateTime
      type: object
      properties:
        documentName:
          maxLength: 150
          type: string
          description: documentName has to be appended with file extension
          example: test.docx
          minLength: 1
        documentType:
          maxLength: 100
          type: string
          minLength: 1
        uploadedDateTime:
          type: string
          format: date-time
          minLength: 1
        documentURL:
          maxLength: 500
          type: string
          description: URL of the document to be downloaded
          minLength: 1
        documentCaseID:
          description: documentCaseID of respective document
          type: string
        documentTags:
          description: This defines documentTags which are set on the respective document.. like isPublish,isSensitive.. etc..
          type: array
          items:
            $ref: '#/components/schemas/TagsList'
        documentSize:
          description: This indicates the file size of the document in bytes
          type: number
        updatedBy:
          type: string
          example: Council
    Intenttocommencework:
      required:
        - buildingWorkCommencementDate
        - relatedDevelopmentConsent
        - relatedCCCaseID
        - relatedCCIssueDate
        - relatedDevelopmentConsentCaseID
        - relatedDevelopmentConsentDeterminationDate
        - typeOfWorkIntendedToCommence
        - updatedBy
      type: object
      properties:
        typeOfWorkIntendedToCommence:
          type: string
          description: 
            This is to track the type of work intended for commencement. One of
            the below mentioned values to be selected for
            typeOfWorkIntendedToCommence. Please refer to the reference data API
            for the latest values. 1.Erection of the building 2.Subdivision work
          example: Refer to description for values.
          minLength: 1
        buildingWorkCommencementDate:
          type: string
          description: This is to track the commencement date for building work.
          format: date
          minLength: 1
        relatedDevelopmentConsent:
          type: string
          description: 
            This is to track the related development consent. One of the below
            mentioned values to be selected for relatedDevelopmentConsent.
            Please refer to the reference data API for the latest values.
            1.Development Application number (DA) 2.Complying Development
            Certificate (CDC) 3.State determined (SSI / SSD)
          example: Refer to description for values.
          minLength: 1
        relatedDevelopmentConsentCaseID:
          maxLength: 20
          type: string
          description: This is to track the related development consent (DA) caseID.
          minLength: 1
        relatedDevelopmentConsentDeterminationDate:
          type: string
          description: This is to track the development consent determination date.
          format: date
          minLength: 1
        relatedCCCaseID:
          maxLength: 20
          type: string
          description: 
            This is to track the related construction certificate reference
            number. This field is not applicable when related development
            consent type is CDC and is an applicable field.
          minLength: 1
        relatedCCIssueDate:
          type: string
          description: 
            This is to track the related construction certificate's issue date.
            This field is not applicable when related development consent type
            is CDC.
          format: date
          minLength: 1
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        updatedBy:
          $ref: '#/components/schemas/updatedBy'
    ProvideAddInfo:
      title: ProvideAddInfo
      required:
        - caseStatus
        - responseDate
      type: object
      properties:
        caseStatus:
          type: string
          description: Status of the request for additional information
          example: Complete
          minLength: 1
        childCaseID:
          type: string
          description: An AI case id for RFI
          example: AI-XXXX
        responseDate:
          type: string
          description: Date and time of response
          format: date
          minLength: 1
        responseDetails:
          type: string
          description: Additional information description provided by the applicant
        Documents:
          type: array
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        updatedBy:
          $ref: '#/components/schemas/updatedBy'
    updatedBy:
      title: updatedBy
      type: object
      properties:
        person:
          $ref: '#/components/schemas/PersonBody'
    CreateRef:
      title: CreateRef
      required:
        - caseStatus
      type: object
      properties:
        parentCaseID:
          type: string
          example: CFT-XXXX
        caseStatus:
          maxLength: 80
          type: string
          description: 
            This is to track the case status of the post consent certificate
            application.
          example: Submitted
          minLength: 1
        referralDetails:
          title: agencyToConsultWith
          type: object
          properties:
            agencyName:
              maxLength: 150
              type: string
              description: This is to track to which agency is the activity being referred.
            agencyReferenceNumber:
              maxLength: 150
              type: string
              description: This is to track the reference number of corresponding agency.
            reasonForReferral:
              maxLength: 2000
              type: string
              description: This is to track the reason for referral.
            referredBy:
              type: string
              description: This is to track the referral creators role.
            selectRequiredDocuments:
              type: array
              description: Select documents
              items:
                $ref: '#/components/schemas/SelectReferralDocuments'
          description: Add agency
        reviewOfOutcome:
          $ref: '#/components/schemas/ReviewOfOutcome'
        preliminaryReview:
          $ref: '#/components/schemas/PreliminaryReview'
        retunApplication:
          type: string
          description: Required if the reviewOfOutcome is 'Return application'
        commentsOnDecisionNotRequired:
          type: string
          description: 
            This field will be available on UI if the reviewOfOutcome is
            'Referral noted, decision not required'
        decisionOutcome:
          $ref: '#/components/schemas/DecisionOutcome'
        comments:
          maxLength: 2000
          type: string
          description: This is to track the  Decision outcome comments.
        Documents:
          type: array
          description: 
            This is to track the Documents avialable if the reviewOfOutcome is
            'Return application'
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        updatedBy:
          $ref: '#/components/schemas/updatedBy'
    ReferralAssessment:
      required:
        - caseStatus
        - reviewOfOutcome
        - updatedBy
      type: object
      properties:
        primaryCaseID:
          type: string
          description: This is to track the Post Consent Certificate case ID.
          example: CFT-XXXX
        caseStatus:
          maxLength: 80
          type: string
          description: Status of the Referral case
          example: Submitted
          minLength: 1
        referralDetails:
          title: agencyToConsultWith
          type: object
          properties:
            agencyName:
              maxLength: 150
              type: string
              description: This is to track to which agency is the activity being referred?
            agencyReferenceNumber:
              maxLength: 150
              type: string
              description: This is to track the reference number of corresponding agency.
            reasonForReferral:
              maxLength: 2000
              type: string
              description: 
                This is to track the reason as to why the referral is being
                made.
            referredBy:
              type: string
              description: This is to track the referral creators  role.
            selectRequiredDocuments:
              type: array
              description: This is to track the Selectd documents.
              items:
                $ref: '#/components/schemas/SelectReferralDocuments'
          description: Add agency
        reviewOfOutcome:
          $ref: '#/components/schemas/ReviewOfOutcome'
        preliminaryReview:
          $ref: '#/components/schemas/PreliminaryReview'
        retunApplication:
          maxLength: 1500
          type: string
          description: 
            This is to track the reviewoutcome. Required if the reviewOfOutcome
            is 'Return application'
        commentsOnDecisionNotRequired:
          maxLength: 1500
          type: string
          description: 
            This is to track the the comments, when the decision is not
            required.  This becomes application when reviewOfOutcome is
            'Referral noted, decision not required'
        Documents:
          type: array
          description: 
            This is to track the Documents  avialble if the reviewOfOutcome is
            'Return application'
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        updatedBy:
          $ref: '#/components/schemas/updatedBy'
    SelectReferralDocuments:
      title: selectDocument
      type: string
      description: 
        This indicates the documents uploaded for referrals. Following are the
        example values. Please refer to the reference data API for the latest
        values 1. Land Title Instruments 2. Compliance Certificate 3. Boundary
        Approvals 4. Other
      example: Refer to description for values
    DecisionOutcome:
      title: DecisionOutcome
      type: string
      description: 
        This is to track the  outcome of the review. One of the below mentioned
        values to be selected for DecisionOutcome 1. Approved 2. Not Approved
      example: Refer to description for values
    ReviewOfOutcome:
      title: ReviewOfOutcome
      type: string
      description: 
        This is to track the outcome of the review One of the below mentioned 
        values are applicable for ReviewOfOutcome. Please refer to the reference
        data API for the latest values. 1 . Accept application 2. Return
        application 3. Referral noted, decision not required
      example: Refer to description for values
