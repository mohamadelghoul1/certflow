              $ref: '#/components/schemas/BuilderCompany'
          description: 
            This is to track the builder or Principal Contractor details. This
            is not applicable to Subdivision certificate.
        additionalBuilderDetails:
          type: array
          description: 
            This is to track any additional builder details excluding the one
            mentioned in 'buildersDetailsOrPrincipalContractor'.
          items:
            $ref: '#/components/schemas/AdditionalBuilderDetails'
        ownership:
          $ref: '#/components/schemas/Ownership'
        ownerDetails:
          type: array
          items:
            $ref: '#/components/schemas/OwnerDetails'
        buildingWork:
          $ref: '#/components/schemas/BuildingWork'
        longServiceLevyPaid:
          $ref: '#/components/schemas/LongServiceLevyPaid'
        securityConditions:
          type: boolean
          description: 
            This is to track the security or site conditions which may impact on
            the person undertaking the inspection like locked gates, dogs,
            animals etc. This is not applicable for subdivision certificate.
        detailsOfSecurityConditions:
          maxLength: 2000
          type: string
          description: 
            This is to track the details of the security conditions. This is
            applicable when 'securityConditions' is selected as 'Yes'.
        payerInformation:
          type: object
          properties:
            payerType:
              $ref: '#/components/schemas/PayerType'
            payerPerson:
              $ref: '#/components/schemas/payerPerson'
            payerCompany:
              $ref: '#/components/schemas/payerCompany'
        developerDetails:
          $ref: '#/components/schemas/developerDetail'
        devPurpose:
          maxLength: 2000
          type: string
          description: 
            This is to track the detailed description of the development. This
            is applicable for PCA, SWC, CC & OC, but not applicable for
            'Subdivision Certificate'
        commonApplicationTypes:
         type: array
         items: 
           $ref: '#/components/schemas/CommonApplicationType'
         description: This is to track the common Application types.This is required for CC, OC ,PCA and for it's corresponding parent cases that are created after 1st of September'23.
            Example values are 
              1. Advertising and signage
              2. Alterations or additions to an existing building or structure
              3. Change of use of land or a building or the classification of a building under the Building Code of Australia
              4. Demolition
              5. Erection of a new structure
              6. Hours of operation and trading
              7. Temporary building, structure or use
        typeOfDevelopment:
          type: array
          items:
            $ref: '#/components/schemas/typeOfDevelopment'
        isDevelopmentIncludeAffordableHousing:
          type: boolean
          description: 
            This is to track if the development includes affordable housing.
            This is applicable only when Approval type is DA and CertficateType
            is "Occupational certificate" and based on relevant development types. 
        isApplicationForInfillAffordableHousing:
          type: boolean
          description: 
            This is to track if the application is submitted for infill
            affordable housing. This is applicable only when 
            isDevelopmentIncludeAffordableHousing attribute is true.
        regCommunityHousingProviderName:
          maxLength: 512
          type: string
          description: 
            This is to track the name of the registered community housing
            provider that will be managing the affordable housing component of
            the site. This is applicable only when Approval type is DA and
            CertficateType equals "Occupational certificate" and
            typeOfDevelopment is "Boarding house" and
            isDevelopmentIncludeAffordableHousing is true.
        isBuildToRentHousing:
          type: boolean
          description: 
            This is to track if the development proposed to be build-to-rent
            housing. Applicable  when Approval type is DA and CertificateType is
            "Occupational certificate" and when applicable. 
        typeofSWCProposed:
          type: array
          items:
            $ref: '#/components/schemas/TypeofSWCProposed'
        typeofSWCdevelopment:
          type: array
          items:
            $ref: '#/components/schemas/TypeofSWCdevelopment'
        investmentValue:
          type: string
          description: 
            This is to track the estimated cost of the development. This
            indicates the full contract price inclusive of GST
        capitalInvestmentValue:
          type: number
          maxLength: 15
          description: This is to track the capital investment value in accordance with the Environmental Planning and Assessment Regulation 2021.Capital Investment Value of a development or project includes all costs necessary to establish and operate the project.This is applicable for construction certificate.
        developmentInformation:
          $ref: '#/components/schemas/DevelopmentInformation'
        materialsToBeUsed:
          $ref: '#/components/schemas/MaterialsToBeUsed'
        businessName:
          $ref: '#/components/schemas/BusinessName'
        registeredCertifierOrgDetails:
          $ref: '#/components/schemas/registeredCertifierOrgDetails'
        principalCertifierOrgDetails:
          $ref: '#/components/schemas/principalCertifierOrgDetails'  
