            of the development is within 'Class 2', 'Class 3' & 'Class 9C' buildings.
          items:
            $ref: '#/components/schemas/designpractitioner'
        principaldesignpractitioner:
          type: array
          description: 
            This is to track the principal design Practitioner details. This
