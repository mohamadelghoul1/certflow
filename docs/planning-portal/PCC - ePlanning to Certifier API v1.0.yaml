      title: classOfDevelopment
      type: string
      description: 
        example values for classOfDevelopment


        1. Class 1a 2. Class 1b 3. Class 2 4. Class 3 5. Class 4 6. Class 5 7.
        Class 6 8. Class 7a 9. Class 7b 10. Class 8 11. Class 9a 12. Class 9b
        13. Class 9c 14. Class 10a 15. Class 10b 16. Class 10c
    OwnerDetails:
      type: object
