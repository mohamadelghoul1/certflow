    DevelopmentInformation:
      type: object
      properties:
        landArea:
          type: number
          description: 
            This is to track the Total site area in sqm when applicable. 
          format: double
        existingGrossFloorArea:
          type: number
          description: 
            This is to track the existing gross floor area floor area (sqm) of
            the development.
          format: double
