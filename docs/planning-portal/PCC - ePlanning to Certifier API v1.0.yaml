        This is to track the related approval type of the certificate applied.
        Example values would be 1. Development Application number (DA) 2.
        Complying Development Certificate (CDC) 3. State determined (SSI / SSD).
        Please refer the reference data API for latest values.
      example: Refer to description for values
    LongServiceLevyPaid:
      type: string
      description: 
        This is to track if the Building and Industry Long Service Levy is paid
        when the value of the work is $25,000 or more. This is applicable for
        Constuction certificate. Example values are 1. Yes 2. No 3. NA
    PostDetermination:
      required:
        - buildingComplianceDeclaration
      type: object
      properties:
        isPractitionerDeclaredAsBuiltVariationConfirmation:
          type: boolean
          description: 
            This is to track variations to the As-built regulated designs indicated by the practitioner. The value false means there are no further variations to the As-Built regulated designs and declarations.The value true means there are additional regulated designs and building compliance declarations are required.
        buildingComplianceDeclaration:
          required:
            - isDesignComplianceDeclarationObtained
            - isDesignPreparedByRegisteredPractitioner
            - isPrincipalComplianceDeclarationObtained
            - isRegisteredPrincipalDesignPractitionerAppointed
            - isbuildingWorkComplied
            - stepsToEnsureCompliance
          type: object
          description: It infers Building Compliance Declarations. 
          properties:
            isbuildingWorkComplied:
              type: boolean
              description: 
                This is to track if the building work is complied with the
                requirements of the Building Code of Australia.
            reasonForbuildingWorkNotCompliant:
              type: string
              description: 
                This is to track if the response to "Has the building work
                complied with the requirements of the Builiding Code of
                Australia." Applicable when isbuildingWorkComplied is false
            stepsToEnsureCompliance:
              type: string
              description: This is to track the steps taken to set out compliance. 
              minLength: 1
            isDesignPreparedByRegisteredPractitioner:
              type: boolean
              description: 
                This is to track if the design has been prepared by a registered
                design practitioner and the building work built in accordance
                with the design.
            reasonForDesignNotPreparedByRegisteredPractitioner:
              type: string
              description: 
                This is to track the reason when the response to
                "isDesignPreparedByRegisteredPractitioner" is false.
            isDesignComplianceDeclarationObtained:
              type: boolean
              description: 
                This is to track if the design compliance declaration has been
                obtained in relation to regulated designs used for the building
                work.
            designComplianceDeclarationObtainedInfo:
              type: string
              description: 
                This is to track if the response to
                "isDesignComplianceDeclarationObtained" is false.
            isRegisteredPrincipalDesignPractitionerAppointed:
              type: boolean
              description: 
                This is to track if a registered principal design practitioner
                appointed in relation to the building work. If true, Principal
                Design practitioner - Principal compliance declartion should be
                lodged.
            isPrincipalComplianceDeclarationObtained:
              type: boolean
              description: 
                This is to track if a principal compliance declaration been
                obtained in relation to the regulated designs compliance
                declarations relating to the building work.
            principalComplianceDeclarationObtainedInfo:
              type: string
              description: 
                This is to track if the response to "Has a principal compliance
                decalaration been obtained in relation to the regulated designs
                and design compliance declarations relating to the building
                work." Applicable when isPrincipalComplianceDeclarationObtained is false.
        buildingdesignComplianceDeclarations:
          type: array
          description: 
            These are the declarations checked by the builder when completing
            the questions under business compliance declaration section & 
            design Compliance Declaration section.
          items:
            $ref: '#/components/schemas/buildingDesignComplianceDeclarations'
      description: 
        This is to track Post determination. This will be applicable only
        for OC when class of development is Class 2.
    buildingDesignComplianceDeclarations:
      type: string
      description: 
        This is to track Building and design Compliance declarations that are declared by the practitioner when the additional regulated designs and declarations are supplied.
        1. Copy of each design compliance declaration given
        under section 9(3)(b) of the Act for a varied regulated design. 
        2. Copy of Varied regulated design.
        3. Copy of each design compliance declaration obtained under section 20(3) of the Act for a new building element or
        performance solution.
        4. Copy of the regulated design for the new building element or performance solution. 
      example: Refer to description for values
    BuilderCompany:
      type: object
      properties:
