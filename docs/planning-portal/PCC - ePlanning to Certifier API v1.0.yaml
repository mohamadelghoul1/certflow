            This is to track the related DA approval type’s CC case
            determination status.
        isExemptFromSEPPNonResidential: 
          type: boolean
          description: 
            This is to track if the development is exempt from the State Environmental Planning Policy (Sustainable Buildings) 2022, Chapter 3, relating to non-residential buildings for any of the following reasons. This is exempted if DA was submitted on the NSW Planning Portal before 1st October 2023 or The DA was submitted on the NSW Planning Portal on or after 1st October 2023 but was deemed exempt due to the reasons outlined in Chapter 3.1.
