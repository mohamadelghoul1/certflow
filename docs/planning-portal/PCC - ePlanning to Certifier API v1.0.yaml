            issued to all entities registered in the Australian Business
            Register (ABR)
        ACN:
          maxLength: 11
          type: string
          description: The Australian Company Number (ACN) is a nine digit number
        tradingName:
          maxLength: 256
          type: string
          description: This is to track the trading name.
