          type: number
          description: 
            This is to track the proposed gross floor area of the new
            development when applicable. 
          format: double
        totalNetLettableArea:
          type: integer
          description: 
            This is to track the Net Lettable Area(NLA) which is the total area of all internal tenancies across all floors in a commerical building, excluding public access, building services, staff and cleaning areas. This is applicable for construction certificate. 
        currentBuildingUse:
          type: string
          description: 
