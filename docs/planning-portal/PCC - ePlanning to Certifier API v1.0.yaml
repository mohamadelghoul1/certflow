            value against the 'noofDwellingsErected' when the value '2
            bedrooms'appears against 'noOfBedrooms'.
          format: double
        threeBedProposedDev:
          type: number
          description: 
            Number of three-bedroom dwellings in the proposed development. This
            attribute will soon become obsolete in the upcoming versions as it's
            replaced with the relevant attributes under the object
            'NumberofBedrooms'. Value for this attribute can be referred to the
            value against the 'noofDwellingsErected' when the value '3
            bedrooms'appears against 'noOfBedrooms'.
          format: double
        fourBedProposedDev:
          type: number
          description: 
            Number of four-bedroom dwellings in the proposed development. This
            attribute will soon become obsolete in the upcoming versions as it's
            replaced with the relevant attributes under the object
            'NumberofBedrooms'. Value for this attribute can be referred to the
            value against the 'noofDwellingsErected' when the value '4 bedrooms'
            appears against 'noOfBedrooms'.
          format: double
        height:
          type: number
          description: Ultimate height of the development (m) when applicable. 
          format: double
        preExistingDwellingsOnSite:
          type: number
          description: Number of pre-existing dwellings on site when applicable. 
          format: double
        dwellingsDemolished:
          type: number
          description: Number of dwellings to be demolished. 
          format: double
        unitsProposed:
          type: number
          description: Number of dwellings proposed as part of this certificate. 
          format: double
        storiesProposed:
          type: number
          description: Number of storeys proposed in the new building(s) when applicable. 
          format: double
          maxLength: 4
        proposedLots:
          type: integer
          description: Number of proposed lots when applicable. 
          format: int32
        existingLots:
          type: integer
          description: Number of proposed lots when applicable. 
          format: int32
        numOfBedrooms:
          type: array
          items:
            $ref: '#/components/schemas/NumberofBedrooms'
      description: This is applicable for CC, PCA, SC & SWC. 
    NumberofBedrooms:
      required:
        - noOfBedrooms
      type: object
      properties:
        noOfBedrooms:
          type: string
          description: 
            This is to track the number of bedrooms that are proposed to be
            demolished and/or erectd by size of dwelling. 1. Studio 2. 1 bedroom
            3. 2 bedrooms 4. 3 bedrooms 5. 4 bedrooms 6. 5 bedrooms 7. 6+
            bedrooms
