        detailsOfSecurityConditions:
          maxLength: 2000
          type: string
          description: 
            This is to track the details of the security conditions. This is
            applicable when 'securityConditions' is selected as 'Yes'
        payerInformation:
          type: object
          properties:
            payerType:
              $ref: '#/components/schemas/PayerType'
            payerPerson:
              $ref: '#/components/schemas/payerPerson'
            payerCompany:
              $ref: '#/components/schemas/payerCompany'
        developerDetails:
          $ref: '#/components/schemas/developerDetail'
        devPurpose:
          maxLength: 2000
          type: string
          description: 
            This is to track the detailed description of the development. Not
            applicable for 'Subdivision Certificate'
        commonApplicationTypes:
          type: array
          items: 
            $ref: '#/components/schemas/CommonApplicationType'
          description: This is to track the common Application types.This is required for CC, OC ,PCA and for it's corresponding parent cases that are created after 1st of September'23.
            Example values are 
              1. Advertising and signage
              2. Alterations or additions to an existing building or structure
              3. Change of use of land or a building or the classification of a building under the Building Code of Australia
              4. Demolition
              5. Erection of a new structure
              6. Hours of operation and trading
              7. Temporary building, structure or use
        typeOfDevelopment:
          type: array
          items:
            $ref: '#/components/schemas/typeOfDevelopment'
        isDevelopmentIncludeAffordableHousing:
          type: boolean
          description: 
            This is to track if the development includes affordable housing.
            This is applicable only when Approval type is DA and CertficateType
            is "Occupational certificate" and based on relevant development types. 
        isApplicationForInfillAffordableHousing:
          type: boolean
          description: 
            This is to track if the application is submitted for infill
            affordable housing. This is applicable only when 
            isDevelopmentIncludeAffordableHousing attribute is true.
        regCommunityHousingProviderName:
          maxLength: 512
          type: string
          description: 
            This is to track the name of the registered community housing
            provider that will be managing the affordable housing component of
            the site. This is applicable only when Approval type is DA and
            CertficateType equals "Occupational certificate" and
            typeOfDevelopment is "Boarding house" and
            isDevelopmentIncludeAffordableHousing is true.
        isBuildToRentHousing:
          type: boolean
          description: 
            This is to track if the development proposed to be build-to-rent
            housing. Applicable  when Approval type is DA and CertificateType is
            "Occupational certificate" and typeOfDevelopment is "Residential
            flat building","Shop top housing","Multi-dwelling housing".
        typeofSWCProposed:
          type: array
          items:
            $ref: '#/components/schemas/TypeofSWCProposed'
        typeofSWCdevelopment:
          type: array
          items:
            $ref: '#/components/schemas/TypeofSWCdevelopment'
        investmentValue:
          type: string
          description: 
            This is to track the estimated cost of the development. Full
            contract price inclusive of GST is indicated.
        capitalInvestmentValue:
          type: number
          maxLength: 15
          description: This is to track the capital investment value in accordance with the Environmental Planning and Assessment Regulation 2021.Capital Investment Value of a development or project includes all costs necessary to establish and operate the project.This is applicable for construction certificate.
        developmentInformation:
          $ref: '#/components/schemas/DevelopmentInformation'
        materialsToBeUsed:
          $ref: '#/components/schemas/MaterialsToBeUsed'
        businessName:
          $ref: '#/components/schemas/BusinessName'
        registeredCertifierOrgDetails:
          $ref: '#/components/schemas/registeredCertifierOrgDetails'
        principalCertifierOrgDetails:
          $ref: '#/components/schemas/principalCertifierOrgDetails'   
        buildingpractitioner:
          type: array
          description: 
            This is to track the building practitioner details. This applies to
            Occupation Certificate where all or part
            of the development is within 'Class 2', 'Class 3' & 'Class 9C' buildings .
          items:
            $ref: '#/components/schemas/buildingpractitioner'
        designpractitioner:
          type: array
          description: 
            This is to track the design Practitioner details.This applies to
             Occupation Certificate where all or part
            of the development is within 'Class 2', 'Class 3' & 'Class 9C' buildings.
          items:
            $ref: '#/components/schemas/designpractitioner'
        principaldesignpractitioner:
          type: array
          description: 
            This is to track the principal design Practitioner   details. This
            applies to  Occupation Certificate where
            all or part of the development is within 'Class 2', 'Class 3' & 'Class 9C' buildings.
          items:
            $ref: '#/components/schemas/principaldesignpractitioner'
        isChangesRequiredInFireSafetySystem:
          type: boolean
          description: 
            This is to track the values(yes/no) whether are we going to modify
            existing relevant fire safety systems or not.Not required for
            'Subdivision works certificate'.
        isFireSafetyMeasuresRequiredForBuilding:
          type: boolean
          description: 
            This is to track whether values(yes/no) whether are we proposed fire
            safety measures to be installed in the building or not.Not required
            for 'Subdivision works certificate'.
        modifiedSafeteyMeasures:
          type: array
          description: If RelevantSafety selected as 'Yes'.
          items:
            $ref: '#/components/schemas/modifiedSafeteyMeasures'
        proposedSafetyMeasures:
          type: array
          description: 
            If Relevant Safety selected as 'Yes' and Safety Measures selected as
            'Yes'
          items:
            $ref: '#/components/schemas/proposedSafetyMeasure'
        isNABERSFormAccompanied:
          type: boolean
          description: 
            This is to track if the NABERS Embodied Emissions Materials Form accompany this application. This is applicable for construction certificate when the development is not exempt from SBSEPP (isExemptFromSEPPNonResidential=false).
        emissionsReportVerifierDetails:
            $ref: '#/components/schemas/emissionsReportVerifierDetails'    
        isPrescribedLCDMetTheCriteria:  
          type: boolean
          description: 
           This is to track if the development is a prescribed large commercial development that involves any of the consideration. This is applicable for construction certificate when the development is not exempt from SBSEPP (isExemptFromSEPPNonResidential=false).
        waterReportMethodsRequired:
          type: array
          description: 
              This is to track, how the water standards are being achieved by indicating where water saving measured are integrated into drawings and specifications. Please find below example values. This is applicable for construction certificate when the development is a prescribed large commercial development(isPrescribedLCDMetTheCriteria=true).
              1. Annotated drawings, and/or
              2. Specifications  
              3. Other
          items: 
               $ref: '#/components/schemas/WaterReportMethodsRequired'   
        waterReportMethodRequiredOther: 
          maxLength: 2000
          type: string
          description : This is to track the data entered under any 'Other' reason entered by the applicant on the water standards (waterReportMethodsRequired).This is applicable for construction certificate.
        waterReportDocumentReferences:
          type: string
          maxLength: 2000
          description : This is track the details and document references of the water report.This is applicable for construction certificate.
        isDevelopmentInCityOfSydneyLGA:
          type: boolean
          description: 
                This is to track if development is in the City of Sydney Local Government Area. This is applicable for construction certificate when  the development is not exempt from SBSEPP and when the development is a prescribed large commercial development (isExemptFromSEPPNonResidential=false & isPrescribedLCDMetTheCriteria = true ).      
        developmentRequirements:
          type: array
          description: 
            This is to track the proposed development details. This is
            applicable  for 'Subdivision Certificate'.
          items:
            $ref: '#/components/schemas/developmentRequire'
        anticipatedConstructionStartDate:
          type: string
          description: 
            This is to track the Building works commencement date. This is
            applicable for PCA.
          format: date
        anticipatedOCSoughtDate:
          type: string
          description: 
            This is to track anticipated OC sought date. This is applicable for
            Principal Certifier Appointment.
          format: date
        typeOfSubDivisionProposed:
          type: array
          description: 
            This is to track the type of subdivision proposed. This is
            applicable for Subdivision Certificate.
          items:
            $ref: '#/components/schemas/typeOfSubDivisionProposed'
        devCategoryForParkingSpaces:
          type: array
          description: This is to track the number of parking spaces for application. This is applicable for Occupation certificate. 
          items:
            $ref: '#/components/schemas/devCategoryForParkingSpaces'    
        isNaturalDisaster:
          type: boolean
          description: 
            This is to track if this application is a direct result of a matter
            declared by the government to be an emergency and/or a natural
            disaster (for example, an application for re-building a home
            destroyed by bushfire).This is not applicable when certificateType
            is 'Principal Certifier Appointment'(PCA)
        housingAndProductivityContributions:
          type: array
          description: This is to track the stages for which the certificate is being sought. This is applicable when Housing and Productivity contributions have been identified for the certificates for the staged developments. This is not applicable for PCA. 
          items: 
            $ref: '#/components/schemas/Stage'
        subjectOfOrder:
          type: boolean
          description: 
            This is to track the subject of an order. This is will hold the
            value for the question 'Is the subdivision the subject of an order
            of the Land and Environment Court under section 40 of the Land and
            Environment Court Act 1979'. This is applicable for Subdivision
            Certificate.
        PPN:
          type: string
          description: 
            This is to track the value of Pre-allocated Plan Number. This is
            applicable for Subdivision certificate type. PPN number is a plan
            identifier generated by a registered surveyor through NSW Land
            registry services portal.
        referralCases:
          type: array
          description: 
            This is to track the referral case IDs and they are applicable for
            Subdivision certificate.
          items:
            $ref: '#/components/schemas/referralCases'
        buildingWorkCommencementDt:
          type: string
          description: This is to track the date of the Building work commencement.
          format: date
        documents:
          type: array
          description: This block will contain the full set of documents.
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        deltaDocuments:
          type: array
          description: 
            This block will be sending the delta documents uploaded or updated
            as part of update operation.
          items:
            $ref: '#/components/schemas/DownloadableDocument'
        postDetermination:
          $ref: '#/components/schemas/PostDetermination'
        declarations:
          type: array
          items:
            $ref: '#/components/schemas/Declaration'
        determinationOutcome:
          type: string
          description: 
            This is to track the determination outcome of the application. This is applicable for the UpdatePCC which is emitted post determination and for all certificates except PCA.
    applicantDetails:
      title: applicantDetails
      type: object
      properties:
        title:
          $ref: '#/components/schemas/Title'
        applicantPerson:
          $ref: '#/components/schemas/Person'
