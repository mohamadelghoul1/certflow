          type: boolean
          description: 
            This is to track if the NABERS Embodied Emissions Materials Form accompany this application. This is applicable for construction certificate when the development is not exempt from SBSEPP (isExemptFromSEPPNonResidential=false).
        emissionsReportVerifierDetails:
            $ref: '#/components/schemas/emissionsReportVerifierDetails'   
        isPrescribedLCDMetTheCriteria:  
          type: boolean
          description: 
           This is to track if the development is a prescribed large commercial development that involves any of the consideration. This is applicable for construction certificate when the development is not exempt from SBSEPP (isExemptFromSEPPNonResidential=false).  
        waterReportMethodsRequired:
          type: array
          description: 
              This is to track, how the water standards are being achieved by indicating where water saving measured are integrated into drawings and specifications. Please find below example values. This is applicable for construction certificate when the development is a prescribed large commercial development(isPrescribedLCDMetTheCriteria=true).
              1. Annotated drawings, and/or
              2. Specifications  
              3. Other
          items: 
               $ref: '#/components/schemas/WaterReportMethodsRequired'
        waterReportMethodRequiredOther: 
          type: string
          maxLength: 2000
          description : This is to track the data entered under any 'Other' reason entered by the applicant on the water standards (waterReportMethodsRequired). This is applicable for construction certificate.
        waterReportDocumentReferences:
          type: string
          maxLength: 2000
          description : This is track the details and document references of the water report. This is applicable for construction certificate.
        isDevelopmentInCityOfSydneyLGA:
          type: boolean
          description: 
                This is to track if development is in the City of Sydney Local Government Area. This is applicable for construction certificate when not exempted from SEPP and when the development is a prescribed large commercial development (isExemptFromSEPPNonResidential=false & isPrescribedLCDMetTheCriteria = true ).        
        developmentRequirements:
          type: array
          description: 
            This is to track the proposed development details. This is
            applicable  for 'Subdivision Certificate'.
          items:
            $ref: '#/components/schemas/developmentRequire'
