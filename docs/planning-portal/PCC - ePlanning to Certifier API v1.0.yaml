    SafetyMeasure:
      type: string
      description: 
        This is to track the values of the firesafety measures. This is
        applicable for CC. Below are few exampe values. Please refer the
        reference data API for the latest values. 1. Access Panels, doors and
        hoppers to fire resisting shaft 2. Automatic fail-safe devices 3.
        Automatic fire detection and alarm system* 4. Automatic fire suppression
        system (sprinkler)* 5. Emergency lighting 6. Emergency lifts 7.
        Emergency warning and intercommunication system 8. Exit signs 9. Fire
        control centres and rooms 10. Fire dampers 11. Fire doors 12. Fire
        hydrant systems* 13. Fire seals (protecting openings in fire resisting
        components of building) 14. Fire shutters 15. Fire windows 16. Hose reel
        systems 17. Lightweight construction 18. Mechanical air handling systems
        (smoke control) * 19. Perimeter vehicle access for emergency vehicles
        20. Portable fire extinguishers 21. Safety curtains in proscenium
        openings 22. Smoke and Heat Vents 23. Smoke dampers 24. Smoke detectors
        and heat detectors 25. Smoke doors 26. Solid-Core doors 27. Standby
        Power Systems 28. Wall wetting sprinkler and drencher systems* 29.
        Warning and operational signs 30. Other (please specify)
      example: Refer to description for values
    SubType:
      type: string
      description: 
        This indicates the subtype of the certificate applied. It is applicable
        for Subdivision certificate, Construction certificate and Occupation
        certificate. Example values for SC and CC would be 1.Certificate for
        part of the development 2.Certificate for the full development. For OC,
        when the approval type's determination status is 'false' 1.Occupation
        certificate for a partially completed building 2.Occupation certificate
        for part of the building 3.Occupation certificate for whole building.
        For OC, when the approval type's determination status is 'true'
        1.Interim Occupation certificate 2.Final occupation certificate. Please
        refer to the reference data API for the latest values.
      example: Refer to description for values
    Title:
