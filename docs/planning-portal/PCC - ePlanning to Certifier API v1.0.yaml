          type: boolean
          description: 
            This is to track if the related 'approvalType' for the certificate
            applied is submitted via NSW planning portal. This is only
            applicable when the user selects the 'approvalType' as Complying
            Development Certificate (CDC) or Development Application number (DA)
        relatedPortalCaseID:
          maxLength: 10
