          type: boolean
          description: 
            This indicates if the applicant is proposing to carry out
            alterations/modifications to existing 'relevant fire safety
            systems'.This is applicable for CC.
        isFireSafetyMeasuresRequiredForBuilding:
          type: boolean
          description: 
            This is to indicate if the proposed fire safety measures are
            required to be installed in the building. This is applicable for CC.
        modifiedSafeteyMeasures:
          type: array
          description: 
            This is to track the types of fire safety measures when carrying out
            modifications/alterations to the existing fire safety systems.
            Please refer to the reference data API for the latest values. This
            is applicable for CC.
          items:
            $ref: '#/components/schemas/modifiedSafeteyMeasures'
        proposedSafetyMeasures:
          type: array
          description: 
            This is to track the types of fire safety measures when accepting to
            installthe proposed fire safety systems.Please refer to the
            reference data API for the latest values.
          items:
            $ref: '#/components/schemas/proposedSafetyMeasure'
